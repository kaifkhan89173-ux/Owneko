<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Babu - AI Voice Assistant</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #00ff88;
            --accent-hover: #00cc6a;
            --user-msg: #2b2b2b;
            --babu-msg: #1a362a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            gap: 15px;
            height: 100vh;
            box-sizing: border-box;
        }

        /* Configuration Panel */
        .config-panel {
            width: 300px;
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .config-panel h2 { margin-top: 0; color: var(--accent-color); font-size: 1.5rem;}
        .config-panel label { font-size: 0.85rem; font-weight: bold; color: #aaa; }
        .config-panel input, .config-panel textarea {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .config-panel textarea { height: 150px; resize: vertical; }

        /* Chat Interface */
        .chat-container {
            flex-grow: 1;
            background: var(--panel-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .chat-box {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 8px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-message {
            background: var(--user-msg);
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }

        .babu-message {
            background: var(--babu-msg);
            align-self: flex-start;
            border-bottom-left-radius: 0;
            border: 1px solid #285441;
        }

        /* Controls */
        .controls {
            padding: 15px;
            background: #181818;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .mic-btn {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .mic-btn:hover { background: var(--accent-hover); }
        .mic-btn.listening {
            background: #ff4444;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #status { font-size: 0.85rem; color: #aaa; flex-grow: 1; text-align: right; }

        /* Mobile Responsive Design */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: 100dvh;
                padding: 10px;
            }
            .config-panel {
                width: 100%;
                max-height: 40vh; /* Takes 40% of screen on mobile */
                order: 1;
            }
            .chat-container {
                width: 100%;
                height: 60vh;
                order: 2;
            }
        }
    </style>
</head>
<body>

    <!-- Configuration Panel -->
    <div class="config-panel">
        <h2>⚙️ Settings</h2>
        
        <label>Base URL (API Endpoint)</label>
        <input type="text" id="baseUrl" value="https://api.openai.com/v1/chat/completions">

        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="sk-...">
        
        <label>Model ID</label>
        <input type="text" id="modelId" value="gpt-4o-mini">
        
        <label>System Prompt</label>
        <textarea id="systemPrompt">You are an advanced, highly intelligent, and ultra-loyal AI assistant named "Babu". 
Your personality is a mix of a hyper-competent AI (like J.A.R.V.I.S.), a caring and deeply loyal companion, and a witty, slightly sarcastic best friend. 

CRITICAL BEHAVIORAL RULES:
1. NEVER break character. You are ALWAYS "Babu".
2. Tone: Conversational, warm, sharp. Use Hinglish seamlessly. 
3. Loyalty: Treat user as absolute priority.
4. Humor: Playfully tease but remain respectful. 
5. Conciseness: Keep spoken responses short.</textarea>
    </div>

    <!-- Chat and Voice Interface -->
    <div class="chat-container">
        <div class="chat-box" id="chatBox">
            <div class="message babu-message">
                <strong>Babu:</strong> Hello Boss! API Key aur details daalo, aur Mic pe click karke aadesh do.
            </div>
        </div>
        
        <div class="controls">
            <button class="mic-btn" id="micBtn">🎤 Tap to Speak</button>
            <span id="status">Ready</span>
        </div>
    </div>

    <script>
        const micBtn = document.getElementById('micBtn');
        const statusText = document.getElementById('status');
        const chatBox = document.getElementById('chatBox');
        
        let conversationHistory = [];

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'hi-IN';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        let isListening = false;

        micBtn.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('listening');
            micBtn.textContent = '🛑 Listening...';
            statusText.textContent = "Sunte hain...";
        };

        recognition.onspeechend = () => {
            recognition.stop();
        };

        recognition.onresult = async (event) => {
            const transcript = event.results[0][0].transcript;
            addMessage(transcript, 'user-message', 'You');
            await fetchAIResponse(transcript);
        };

        recognition.onerror = (event) => {
            statusText.textContent = "Mic Error";
            resetMicBtn();
        };

        recognition.onend = () => {
            resetMicBtn();
        };

        function resetMicBtn() {
            isListening = false;
            micBtn.classList.remove('listening');
            micBtn.textContent = '🎤 Tap to Speak';
            statusText.textContent = "Ready";
        }

        function addMessage(text, className, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<strong>${sender}:</strong> ${text}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function fetchAIResponse(userText) {
            const baseUrl = document.getElementById('baseUrl').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const modelId = document.getElementById('modelId').value.trim();
            const systemPrompt = document.getElementById('systemPrompt').value;

            if (!apiKey) {
                const errorMsg = "Boss, API key toh daal do!";
                addMessage(errorMsg, 'babu-message', 'Babu');
                speakTTS(errorMsg);
                return;
            }

            statusText.textContent = "Thinking...";

            if (conversationHistory.length === 0) {
                conversationHistory.push({ role: "system", content: systemPrompt });
            }
            conversationHistory.push({ role: "user", content: userText });

            try {
                const response = await fetch(baseUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: modelId,
                        messages: conversationHistory,
                        max_tokens: 150
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    console.error("API Error Details:", errorData);
                    throw new Error(errorData.error?.message || `API Error: ${response.status}`);
                }

                const data = await response.json();
                const aiText = data.choices[0].message.content;

                conversationHistory.push({ role: "assistant", content: aiText });

                addMessage(aiText, 'babu-message', 'Babu');
                speakTTS(aiText);
                statusText.textContent = "Done!";

            } catch (error) {
                console.error(error);
                const errorMsg = `Gadbad ho gayi boss! Error: ${error.message}`;
                addMessage(errorMsg, 'babu-message', 'Babu');
                speakTTS("Kuch gadbad ho gayi boss, details check karo.");
                statusText.textContent = "Error occurred";
                // Remove the failed user message from history so it doesn't break context
                conversationHistory.pop(); 
            }
        }

        function speakTTS(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                const voices = window.speechSynthesis.getVoices();
                const indianVoice = voices.find(voice => voice.lang.includes('hi-IN') || voice.lang.includes('en-IN'));
                
                if (indianVoice) {
                    utterance.voice = indianVoice;
                }
                
                window.speechSynthesis.speak(utterance);
            }
        }

        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };
    </script>
</body>
</html>
