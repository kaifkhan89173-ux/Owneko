<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eko - Universal AI Chat</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { gray: { 850: '#1f2937', 900: '#111827', 950: '#030712' } } } } }
    </script>

    <!-- Marked.js for Markdown & DOMPurify for security -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>

    <!-- Highlight.js for Code Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(255, 255, 255, 0.1); border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .markdown-body { font-size: 1rem; line-height: 1.6; word-wrap: break-word; }
        .markdown-body p { margin-bottom: 1rem; }
        .markdown-body pre { background: #1e1e1e !important; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1rem; }
        .markdown-body img { border-radius: 0.5rem; max-width: 100%; height: auto; margin: 1rem 0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .cursor-blink::after { content: '▋'; animation: blink 1s step-start infinite; color: #3b82f6; margin-left: 2px; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col font-sans overflow-hidden">

    <!-- Loading Screen -->
    <div id="loading" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-gray-900 text-white">
        <div class="spinner mb-4"></div>
        <h2 class="text-xl font-bold">Eko is waking up...</h2>
    </div>

    <!-- Main App Container -->
    <div id="app" class="flex-1 flex w-full relative h-[100dvh] hidden">
        
        <!-- Mobile Sidebar Overlay -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden md:hidden transition-opacity"></div>

        <!-- Left Sidebar -->
        <aside id="sidebar" class="absolute md:relative top-0 left-0 h-full w-72 bg-gray-50 dark:bg-gray-850 border-r border-gray-200 dark:border-gray-700 z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col shadow-2xl md:shadow-none">
            <div class="p-4 border-b border-gray-200 dark:border-gray-700">
                <button id="btn-new-chat" class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white py-3 px-4 rounded-xl font-medium transition-colors">
                    <i class="fas fa-plus"></i> New Chat
                </button>
            </div>
            <div id="chat-list" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
            <div class="p-4 border-t border-gray-200 dark:border-gray-700 flex flex-col gap-2">
                <button id="btn-settings" class="flex items-center gap-2 text-gray-600 dark:text-gray-300 hover:text-blue-500 transition-colors py-2">
                    <i class="fas fa-cog"></i> Settings
                </button>
                <div class="flex justify-between items-center mt-2">
                    <span class="text-xs text-gray-500">Theme & Voice</span>
                    <div class="flex gap-4">
                        <button id="btn-voice-toggle" class="text-gray-600 dark:text-gray-300 hover:text-blue-500 transition-colors"><i class="fas fa-volume-up"></i></button>
                        <button id="btn-theme" class="text-gray-600 dark:text-gray-300 hover:text-yellow-500 transition-colors"><i class="fas fa-moon"></i></button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="flex-1 flex flex-col h-full relative bg-white dark:bg-gray-900">
            <!-- Header -->
            <header class="flex items-center justify-between p-4 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 z-20 shadow-sm">
                <div class="flex items-center gap-3">
                    <button id="btn-toggle-sidebar" class="md:hidden text-gray-600 dark:text-gray-300 p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 focus:outline-none">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-purple-500">Eko 2.0</h1>
                </div>
                <div id="current-model-display" class="text-xs font-mono text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-800 px-2 py-1 rounded truncate max-w-[120px]"></div>
            </header>

            <!-- Chat Container -->
            <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 pb-40 scroll-smooth">
                <div id="welcome-screen" class="flex flex-col items-center justify-center h-full text-center opacity-70">
                    <i class="fas fa-robot text-6xl text-blue-500 mb-4"></i>
                    <h2 class="text-2xl font-bold mb-2">Hello, I'm Eko.</h2>
                    <p class="text-gray-500 dark:text-gray-400 max-w-md">How can I help you build, learn, or create today?</p>
                </div>
            </div>

            <!-- Input Area -->
            <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-white dark:from-gray-900 via-white dark:via-gray-900 to-transparent pt-10 pb-4 px-4 md:px-8 z-20">
                <form id="chat-form" class="max-w-4xl mx-auto flex items-end gap-2 bg-gray-100 dark:bg-gray-800 border border-gray-300 dark:border-gray-700 rounded-2xl shadow-lg p-2">
                    <textarea id="chat-input" rows="1" placeholder="Message Eko..." class="w-full max-h-32 min-h-[44px] bg-transparent resize-none outline-none text-gray-900 dark:text-gray-100 py-3 px-3 flex-1 rounded-xl" required></textarea>
                    <button type="submit" id="btn-send" class="h-12 w-12 flex-shrink-0 flex items-center justify-center bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition-colors disabled:opacity-50">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center hidden">
        <div class="bg-white dark:bg-gray-850 rounded-2xl w-full max-w-md p-6 m-4 shadow-2xl">
            <h2 class="text-2xl font-bold mb-4 flex items-center justify-between">
                Settings
                <button id="btn-close-settings" class="text-gray-500 hover:text-white p-2"><i class="fas fa-times"></i></button>
            </h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">OpenRouter API Key *</label>
                    <input type="password" id="input-api-key" placeholder="sk-or-v1-..." class="w-full bg-gray-100 dark:bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Model</label>
                    <input type="text" id="input-model" value="openai/gpt-oss-120b:free" class="w-full bg-gray-100 dark:bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">System Prompt</label>
                    <textarea id="input-system" rows="3" class="w-full bg-gray-100 dark:bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 outline-none text-xs">You are Eko. CRITICAL RULE: If user asks for an image, silently generate it using: ![Generated Image](https://image.pollinations.ai/prompt/YOUR-DETAILED-PROMPT) Replace YOUR-DETAILED-PROMPT with english keywords only.</textarea>
                </div>
                <button id="btn-save-settings" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg mt-2">Save Settings</button>
                
                <!-- Danger Zone -->
                <div class="border-t border-gray-700 pt-4 mt-4">
                    <button id="btn-hard-reset" class="w-full bg-red-900/50 hover:bg-red-600 text-red-200 hover:text-white font-bold py-2 rounded-lg text-sm transition-colors border border-red-800">🗑️ Reset & Fix App (Clear Data)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. AUTO-WIPER (Fixes the crash instantly)
        // ==========================================
        const APP_VERSION = "2.0"; // Change this if we ever need to force wipe again
        if(localStorage.getItem('eko_version') !== APP_VERSION) {
            console.log("Old version detected. Wiping memory to prevent crashes...");
            localStorage.clear();
            localStorage.setItem('eko_version', APP_VERSION);
        }

        // ==========================================
        // 2. SAFE STATE MANAGEMENT
        // ==========================================
        const DEFAULT_SETTINGS = {
            apiKey: '',
            model: 'openai/gpt-oss-120b:free',
            systemPrompt: 'You are Eko. CRITICAL RULE: If user asks for an image, silently generate it using: ![Generated Image](https://image.pollinations.ai/prompt/YOUR-DETAILED-PROMPT)',
            darkMode: true,
            voiceEnabled: true
        };

        let STATE = { chats: [], currentChatId: null, settings: {...DEFAULT_SETTINGS}, isGenerating: false };

        try {
            const savedChats = JSON.parse(localStorage.getItem('eko_chats'));
            if(Array.isArray(savedChats)) STATE.chats = savedChats;
            
            const savedSettings = JSON.parse(localStorage.getItem('eko_settings'));
            if(savedSettings && typeof savedSettings === 'object') {
                STATE.settings = { ...DEFAULT_SETTINGS, ...savedSettings }; // Safely merge settings
            }
        } catch(e) {
            console.error("Storage corrupted, formatting...");
            localStorage.clear();
            localStorage.setItem('eko_version', APP_VERSION);
        }

        function saveState() {
            localStorage.setItem('eko_chats', JSON.stringify(STATE.chats));
            localStorage.setItem('eko_settings', JSON.stringify(STATE.settings));
        }

        // ==========================================
        // 3. BULLETPROOF DOM FETCHING & INIT
        // ==========================================
        const getEl = (id) => document.getElementById(id);

        function initApp() {
            try {
                // UI Elements
                const sidebar = getEl('sidebar');
                const overlay = getEl('sidebar-overlay');
                const modal = getEl('settings-modal');
                const chatContainer = getEl('chat-container');
                const chatList = getEl('chat-list');
                const welcomeScreen = getEl('welcome-screen');
                const chatInput = getEl('chat-input');
                const btnSend = getEl('btn-send');

                // Apply initial UI states
                if(STATE.settings.darkMode) {
                    document.documentElement.classList.add('dark');
                    getEl('btn-theme').innerHTML = '<i class="fas fa-sun"></i>';
                } else {
                    document.documentElement.classList.remove('dark');
                    getEl('btn-theme').innerHTML = '<i class="fas fa-moon"></i>';
                }

                if(STATE.settings.voiceEnabled) {
                    getEl('btn-voice-toggle').innerHTML = '<i class="fas fa-volume-up"></i>';
                    getEl('btn-voice-toggle').classList.add('text-blue-500');
                } else {
                    getEl('btn-voice-toggle').innerHTML = '<i class="fas fa-volume-mute"></i>';
                }

                // Populate Settings
                getEl('input-api-key').value = STATE.settings.apiKey;
                getEl('input-model').value = STATE.settings.model;
                getEl('input-system').value = STATE.settings.systemPrompt;
                getEl('current-model-display').textContent = STATE.settings.model.split('/').pop() || 'Model';

                // --- EVENT LISTENERS ---
                
                // Sidebar Toggle
                const toggleSidebar = () => {
                    if(sidebar.classList.contains('-translate-x-full')) {
                        sidebar.classList.remove('-translate-x-full');
                        overlay.classList.remove('hidden');
                    } else {
                        sidebar.classList.add('-translate-x-full');
                        overlay.classList.add('hidden');
                    }
                };
                getEl('btn-toggle-sidebar').onclick = toggleSidebar;
                overlay.onclick = toggleSidebar;

                // Settings Modal
                getEl('btn-settings').onclick = () => { modal.classList.remove('hidden'); };
                getEl('btn-close-settings').onclick = () => { modal.classList.add('hidden'); };
                
                // Save Settings
                getEl('btn-save-settings').onclick = () => {
                    STATE.settings.apiKey = getEl('input-api-key').value.trim();
                    STATE.settings.model = getEl('input-model').value.trim();
                    STATE.settings.systemPrompt = getEl('input-system').value.trim();
                    getEl('current-model-display').textContent = STATE.settings.model.split('/').pop();
                    saveState();
                    modal.classList.add('hidden');
                };

                // Hard Reset Button
                getEl('btn-hard-reset').onclick = () => {
                    if(confirm("Warning: This will delete all your chats and API key. Are you sure?")) {
                        localStorage.clear();
                        location.reload();
                    }
                };

                // Theme & Voice
                getEl('btn-theme').onclick = () => {
                    STATE.settings.darkMode = !STATE.settings.darkMode;
                    saveState();
                    location.reload(); // Quick visual refresh
                };

                getEl('btn-voice-toggle').onclick = () => {
                    STATE.settings.voiceEnabled = !STATE.settings.voiceEnabled;
                    saveState();
                    if(!STATE.settings.voiceEnabled && window.speechSynthesis) window.speechSynthesis.cancel();
                    getEl('btn-voice-toggle').innerHTML = STATE.settings.voiceEnabled ? '<i class="fas fa-volume-up"></i>' : '<i class="fas fa-volume-mute"></i>';
                    getEl('btn-voice-toggle').classList.toggle('text-blue-500', STATE.settings.voiceEnabled);
                };

                // Textarea Auto-resize
                chatInput.oninput = function() {
                    this.style.height = 'auto';
                    this.style.height = (this.scrollHeight) + 'px';
                };
                chatInput.onkeydown = (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        if(!STATE.isGenerating && chatInput.value.trim() !== '') getEl('chat-form').dispatchEvent(new Event('submit'));
                    }
                };

                // Helper Functions
                const scrollToBottom = () => chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
                
                const safeParseMarkdown = (text) => {
                    let html = text;
                    if(typeof marked !== 'undefined') {
                        html = marked.parse(text);
                    }
                    if(typeof DOMPurify !== 'undefined') {
                        html = DOMPurify.sanitize(html, { ADD_ATTR: ['class', 'target'] });
                    }
                    return html;
                };

                const fixImageMarkdown = (text) => {
                    return text.replace(/!\[.*?\]\((https:\/\/image\.pollinations\.ai\/prompt\/)([^)]+)\)/g, (match, base, prompt) => {
                        return `![Generated Image](${base}${encodeURIComponent(prompt.split('?')[0].trim())}?nologo=true)`;
                    });
                };

                const appendMessage = (role, content, isStreaming=false) => {
                    const isUser = role === 'user';
                    const div = document.createElement('div');
                    div.className = `flex w-full ${isUser ? 'justify-end' : 'justify-start'} mb-6`;
                    
                    let htmlContent = isUser ? content.replace(/[&<>'"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])).replace(/\n/g, '<br>') : safeParseMarkdown(fixImageMarkdown(content));

                    div.innerHTML = `
                        <div class="max-w-[85%] md:max-w-[75%] rounded-2xl p-4 shadow-sm ${isUser ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white dark:bg-gray-850 text-gray-900 dark:text-gray-100 rounded-bl-none border border-gray-200 dark:border-gray-700 markdown-body'}">
                            ${htmlContent}
                            ${isStreaming ? '<span class="cursor-blink"></span>' : ''}
                        </div>
                    `;
                    chatContainer.appendChild(div);
                    return div.querySelector('.markdown-body');
                };

                const renderChats = () => {
                    chatList.innerHTML = '';
                    STATE.chats.forEach(chat => {
                        const div = document.createElement('div');
                        const active = chat.id === STATE.currentChatId;
                        div.className = `flex justify-between items-center p-3 rounded-xl cursor-pointer ${active ? 'bg-blue-100 dark:bg-gray-800 text-blue-600 dark:text-blue-400' : 'hover:bg-gray-200 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-300'}`;
                        div.innerHTML = `<span class="truncate text-sm font-medium"><i class="far fa-message mr-2"></i>${chat.title}</span>`;
                        div.onclick = () => {
                            STATE.currentChatId = chat.id;
                            saveState();
                            location.reload(); // Safest way to switch chats on mobile
                        };
                        chatList.appendChild(div);
                    });
                };

                getEl('btn-new-chat').onclick = () => {
                    const newChat = { id: Date.now().toString(), title: 'New Chat', messages: [] };
                    STATE.chats.unshift(newChat);
                    STATE.currentChatId = newChat.id;
                    saveState();
                    location.reload();
                };

                // Chat Form Submit
                getEl('chat-form').onsubmit = async (e) => {
                    e.preventDefault();
                    if (!STATE.settings.apiKey) {
                        alert("API Key is missing! Please save it in settings.");
                        modal.classList.remove('hidden');
                        return;
                    }

                    const text = chatInput.value.trim();
                    if (!text || STATE.isGenerating) return;

                    if(window.speechSynthesis) window.speechSynthesis.cancel();

                    if (!STATE.currentChatId) {
                        STATE.currentChatId = Date.now().toString();
                        STATE.chats.unshift({ id: STATE.currentChatId, title: text.substring(0, 25), messages: [] });
                        renderChats();
                    }
                    const chat = STATE.chats.find(c => c.id === STATE.currentChatId);
                    
                    chat.messages.push({ role: 'user', content: text });
                    appendMessage('user', text);
                    chatInput.value = '';
                    chatInput.style.height = 'auto';
                    scrollToBottom();
                    saveState();

                    STATE.isGenerating = true;
                    btnSend.disabled = true;
                    btnSend.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                    const aiBox = appendMessage('assistant', '', true);
                    scrollToBottom();

                    let fullAiText = "";
                    try {
                        const payload = [];
                        if (STATE.settings.systemPrompt) payload.push({ role: 'system', content: STATE.settings.systemPrompt });
                        payload.push(...chat.messages.slice(-10));

                        const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${STATE.settings.apiKey}` },
                            body: JSON.stringify({ model: STATE.settings.model, messages: payload, stream: true })
                        });

                        if (!res.ok) throw new Error((await res.json()).error?.message || "API Error");

                        const reader = res.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = "";

                        while(true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop();
                            for (const line of lines) {
                                if (line.trim().startsWith('data: ') && line.trim() !== 'data: [DONE]') {
                                    try {
                                        const data = JSON.parse(line.trim().slice(6));
                                        if (data.choices[0].delta.content) {
                                            fullAiText += data.choices[0].delta.content;
                                            aiBox.innerHTML = safeParseMarkdown(fixImageMarkdown(fullAiText)) + '<span class="cursor-blink"></span>';
                                            scrollToBottom();
                                        }
                                    } catch(e) {}
                                }
                            }
                        }
                    } catch(err) {
                        fullAiText = "**Error:** " + err.message;
                    } finally {
                        STATE.isGenerating = false;
                        btnSend.disabled = false;
                        btnSend.innerHTML = '<i class="fas fa-paper-plane"></i>';
                        aiBox.innerHTML = safeParseMarkdown(fixImageMarkdown(fullAiText));
                        chat.messages.push({ role: 'assistant', content: fullAiText });
                        saveState();
                        scrollToBottom();

                        // Voice Output
                        if(STATE.settings.voiceEnabled && window.speechSynthesis) {
                            let cleanTxt = fullAiText.replace(/!\[.*?\]\(.*?\)/g, '').replace(/```[\s\S]*?
```/g, 'Code block.').replace(/[*#_`~]/g, '').trim();
                            if(cleanTxt) {
                                const ut = new SpeechSynthesisUtterance(cleanTxt);
                                const v = window.speechSynthesis.getVoices().find(v=>v.lang.includes('hi')||v.lang.includes('en-IN'));
                                if(v) ut.voice = v;
                                window.speechSynthesis.speak(ut);
                            }
                        }
                    }
                };

                // Render History
                renderChats();
                if (STATE.chats.length > 0) {
                    welcomeScreen.classList.add('hidden');
                    const c = STATE.chats.find(c => c.id === STATE.currentChatId);
                    if(c) c.messages.forEach(m => appendMessage(m.role, m.content));
                    setTimeout(scrollToBottom, 100);
                } else {
                    welcomeScreen.classList.remove('hidden');
                }

                // Show App
                getEl('loading').style.display = 'none';
                getEl('app').classList.remove('hidden');
                if(!STATE.settings.apiKey) modal.classList.remove('hidden');

            } catch(fatalError) {
                console.error("FATAL UI ERROR:", fatalError);
                document.getElementById('loading').innerHTML = `
                    <div style="color:red; text-align:center; padding:20px;">
                        <h2>Crash Detected ❌</h2>
                        <p>App data corrupted.</p>
                        <button onclick="localStorage.clear(); location.reload();" style="margin-top:20px; padding:10px 20px; background:red; color:white; border-radius:8px;">Fix App Instantly</button>
                    </div>
                `;
            }
        }

        // Run after DOM is completely ready
        window.addEventListener('DOMContentLoaded', initApp);
        
        // Failsafe: if DOMContentLoaded fails to fire (sometimes happens on cached mobile pages)
        setTimeout(() => {
            if(document.getElementById('loading').style.display !== 'none') {
                initApp();
            }
        }, 2000);
    </script>
</body>
</html>
